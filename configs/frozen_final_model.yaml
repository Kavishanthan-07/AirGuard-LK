project: AirGuard-LK

task:
  name: chronological_fault_state_detection

model:
  name: LightGBM Current

  feature_set: current_state_aware

  parameters:
    objective: binary
    n_estimators: 350
    learning_rate: 0.03
    num_leaves: 15
    max_depth: 5
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
    class_weight: balanced
    random_state: 42

alerting:
  threshold_source: training_normal_scores
  threshold_quantile: 0.9995
  persistence_minutes: 3

data:
  aggregation_minutes: 1
  causal_timestamp_alignment: true
  pre_event_exclusion_minutes: 360
  post_event_recovery_minutes: 360
  require_model_feature_eligible: true

development:
  events:
    - F02
    - F03

  selected_before_final_holdout: true

  selection_rule: >
    Highest training-normal threshold quantile detecting both
    development events with median fault-state detection delay
    no greater than 5 minutes, then prefer lower worst-fold
    false-alarm rate.

final_evaluation:
  training_events:
    - F01
    - F02
    - F03

  holdout_event: F04

  holdout_used_for_model_selection: false
  holdout_used_for_threshold_selection: false
  holdout_used_for_feature_selection: false

random_seed: 42
